services:

  postgres:
    image: postgres:17
    container_name: sports-platform-postgres

    environment:
      POSTGRES_DB: athlete_db
      POSTGRES_USER: athlete_user
      POSTGRES_PASSWORD: athlete_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data:
